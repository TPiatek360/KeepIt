<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeepIt Backup Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        pre { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4 sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="bg-yellow-400 text-yellow-900 px-2 py-0.5 rounded text-sm">K</span>
                Backup Inspector
            </h1>
            <div class="flex items-center gap-4">
                <input type="file" id="fileInput" accept=".json" class="hidden" />
                <button onclick="document.getElementById('fileInput').click()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Load JSON Backup
                </button>
                <div id="stats" class="text-sm text-gray-500 dark:text-gray-400 hidden">
                    <span id="noteCount">0</span> Notes found
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
        <div id="dropZone" class="border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-2xl p-12 text-center transition-colors hover:border-slate-400">
            <p class="text-gray-500 dark:text-gray-400">Drag and drop your <code class="bg-gray-100 dark:bg-gray-800 px-1 rounded">keepit_backup.json</code> file here</p>
        </div>

        <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Notes will be injected here -->
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const notesContainer = document.getElementById('notesContainer');
        const stats = document.getElementById('stats');
        const noteCount = document.getElementById('noteCount');

        const processFile = (file) => {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    renderNotes(data.notes || []);
                } catch (err) {
                    alert("Invalid JSON file: " + err.message);
                }
            };
            reader.readAsText(file);
        };

        const escapeHtml = (str) => {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        const renderNotes = (notes) => {
            notesContainer.innerHTML = '';
            notesContainer.classList.remove('hidden');
            dropZone.classList.add('hidden');
            stats.classList.remove('hidden');
            noteCount.textContent = notes.length;

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm p-6 flex flex-col h-fit transition-shadow hover:shadow-md";
                
                const title = escapeHtml(note.title || 'Untitled Note');
                const content = escapeHtml(note.content || '');
                const shortId = escapeHtml(note.shortId || 'N/A');
                const tags = (note.tags || []).map(t => escapeHtml(t));
                const date = escapeHtml(note.updatedAt?.seconds ? new Date(note.updatedAt.seconds * 1000).toLocaleString() : 'No date');

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <h2 class="font-bold text-lg leading-tight line-clamp-2">${title}</h2>
                        <span class="text-[10px] font-mono text-gray-400 bg-gray-50 dark:bg-gray-900 px-1.5 py-0.5 rounded">::${shortId}</span>
                    </div>
                    <div class="flex-1 mb-4">
                        <pre class="text-sm text-gray-700 dark:text-gray-300 font-sans leading-relaxed">${content}</pre>
                    </div>
                    <div class="pt-4 border-t border-gray-100 dark:border-gray-700">
                        <div class="flex flex-wrap gap-1.5 mb-2">
                            ${tags.map(t => `<span class="text-[10px] bg-slate-50 dark:bg-slate-900/30 text-slate-600 dark:text-slate-400 px-2 py-0.5 rounded border border-slate-100 dark:border-slate-800">#${t}</span>`).join('')}
                        </div>
                        <div class="text-[10px] text-gray-400 italic">Last updated: ${date}</div>
                    </div>
                `;
                notesContainer.appendChild(card);
            });
        };

        fileInput.onchange = (e) => processFile(e.target.files[0]);

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-slate-500', 'bg-slate-50', 'dark:bg-slate-900/10'); };
        dropZone.ondragleave = () => { dropZone.classList.remove('border-slate-500', 'bg-slate-50', 'dark:bg-slate-900/10'); };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-slate-500', 'bg-slate-50', 'dark:bg-slate-900/10');
            processFile(e.dataTransfer.files[0]);
        };
    </script>
</body>
</html>
